<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nihongo Dōjō</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Yuji+Boku&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE3;
    --paper-2:#EBE5D3;
    --ink:#2A2622;
    --ink-soft:#5C5546;
    --grid:#D9CFB4;
    --red:#AE3B2E;
    --red-soft:#C7594A;
    --moss:#4B5A3A;
    --gold:#DAA520;
    --error:#8C3B2A;
    --teal:#2E6E63;
    --indigo:#48507E;
    --maroon:#7A2438;
    --blue:#2F7FC1;
    --blue-soft:#5B9BD3;
    --dot-correct:#2FAE6B;
    --dot-wrong:#E85C41;
  }
  [data-theme="dark"]{
    --paper:#1E1B18;
    --paper-2:#28241F;
    --ink:#EDE6D6;
    --ink-soft:#B3A996;
    --grid:#3A342C;
    --red:#D2564A;
    --red-soft:#E07A6E;
    --moss:#7FA066;
    --gold:#E8BC3F;
    --error:#E2695C;
    --teal:#5CB3A1;
    --indigo:#8890C4;
    --maroon:#C9677E;
    --blue:#5B9BD3;
    --blue-soft:#7FB0E0;
    --dot-correct:#4CC98A;
    --dot-wrong:#F17A61;
  }
  body{transition:background-color .3s ease, color .3s ease;}
  *{box-sizing:border-box;}
  html, body{overflow-x:hidden; max-width:100vw;}
  body{
    margin:0;
    background: var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family: 'Yuji Boku', 'Shippori Mincho', Georgia, serif;
    font-weight:bold;
    font-style:italic;
    min-height:100vh;
    padding:24px 16px 60px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:640px;margin:0 auto;}
  body.text-large .wrap{zoom:1.15;}
  body.text-xlarge .wrap{zoom:1.3;}

  header{
    text-align:center;margin-bottom:18px;position:relative;
    padding-top:14px; padding-bottom:6px;
  }
  header::before{
    content:'';
    position:absolute; top:-24px; left:-16px; right:-16px; bottom:0;
    background-image:
      radial-gradient(circle at 50% 0%, transparent 17px, var(--gold) 18px, var(--gold) 19px, transparent 20px),
      radial-gradient(circle at 50% 0%, transparent 17px, var(--blue) 18px, var(--blue) 19px, transparent 20px);
    background-position: 0 0, 18px 18px;
    background-size: 36px 36px;
    background-repeat: repeat;
    opacity:0.24;
    pointer-events:none;
    z-index:0;
  }
  header::after{
    content:'';
    position:absolute; top:-24px; left:-16px; right:-16px; bottom:0;
    background-image: linear-gradient(to bottom, transparent 0%, transparent 45%, var(--paper) 95%);
    pointer-events:none;
    z-index:1;
  }
  header > *{ position:relative; z-index:2; }
  .menu-btn{
    position:absolute; top:0; left:0;
    background:var(--paper-2); border:1px solid var(--grid); border-radius:12px;
    width:44px; height:44px; padding:0; flex:none;
    font-size:16px; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
    font-style:normal; font-family:Arial, sans-serif;
    z-index:5;
  }
  .menu-btn:hover{background:var(--blue); color:var(--paper); border-color:var(--blue);}

  .kanji-mark{
    font-size:17px;letter-spacing:0.4em;color:var(--gold);
    text-transform:uppercase;font-family:'Yuji Boku', 'Shippori Mincho', Georgia, serif;
    font-weight:bold;font-style:italic;
  }
  h1{
    font-size:36px;margin:6px 0 2px;font-weight:700;font-style:italic;letter-spacing:0.03em;
    font-family:'Yuji Boku', 'Shippori Mincho', Georgia, serif;
    color:var(--ink); /* fallback se il browser non supporta la sfumatura sul testo */
    background:linear-gradient(100deg, var(--ink) 15%, var(--blue) 55%, #FFFFFF 90%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 1px 0 rgba(0,0,0,0.08);
  }
  h1 .accent{color:var(--red);}
  .subtitle{font-size:13px;color:var(--ink-soft);font-family:'Yuji Boku', 'Courier New', monospace;letter-spacing:0.05em;}

  .level-bar-wrap{max-width:400px;margin:14px auto 0;}
  .level-bar-track{height:6px; background:var(--grid); border-radius:3px; overflow:hidden;}
  .level-bar-fill{height:100%; background:linear-gradient(90deg, var(--blue), var(--gold)); border-radius:3px; transition:width .6s ease;}
  .level-bar-label{font-family:'Yuji Boku', 'Courier New', monospace; font-size:10px; color:var(--ink-soft); text-align:center; margin-top:5px; letter-spacing:0.05em;}

  .stats-row{display:flex;gap:8px;justify-content:center;margin:16px 0 8px;flex-wrap:wrap;}
  .stat{
    border-radius:12px;padding:8px 14px;font-family:'Yuji Boku', 'Courier New', monospace;font-size:11px;
    text-align:center;min-width:80px;border:1px solid transparent;
  }
  .stat b{display:block;font-size:19px;font-family:'Yuji Boku', Georgia, serif;font-weight:bold;font-style:italic;margin-bottom:1px;}
  .stat.c-gold{background:#F1E6C9;border-color:#D9C387;color:#8A6D2E;}
  .stat.c-gold b{color:#8A6D2E;}
  .stat.c-red{background:#F5DAD5;border-color:#E0AFA5;color:var(--red);}
  .stat.c-red b{color:var(--red);}
  .stat.c-maroon{background:#EBD3D9;border-color:#D3A5B0;color:var(--maroon);}
  .stat.c-maroon b{color:var(--maroon);}
  .stat.c-teal{background:#D9EAE5;border-color:#A9CFC4;color:var(--teal);}
  .stat.c-teal b{color:var(--teal);}
  .stat.c-indigo{background:#DEE0EE;border-color:#B4B9DA;color:var(--indigo);}
  .stat.c-indigo b{color:var(--indigo);}
  .stat.c-moss{background:#DEE6D4;border-color:#B4C6A2;color:var(--moss);}
  .stat.c-moss b{color:var(--moss);}

  .streak-dots{display:flex;justify-content:center;gap:5px;margin:6px 0 4px;}
  .streak-dot{width:9px;height:9px;border-radius:50%;background:var(--grid);}
  .streak-dot.correct{background:var(--dot-correct);}
  .streak-dot.wrong{background:var(--dot-wrong);}

  .stamp{
    position:relative;width:80px;height:80px;border-radius:50%;
    border:3px solid var(--gold);color:var(--gold);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:'Yuji Boku', 'Courier New', monospace;font-size:11px;margin:0 auto 8px;
    transform:rotate(-8deg) scale(0);opacity:0;
    transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp.show{opacity:1;transform:rotate(-8deg) scale(1);}
  .stamp b{font-size:26px;font-family:Georgia,serif;}

  .card{background:var(--paper-2);border:1px solid var(--grid);border-radius:14px;border-left:4px solid var(--blue);padding:22px 20px;margin-bottom:16px;animation:cardIn .35s ease;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card .eyebrow{font-family:'Yuji Boku', 'Courier New', monospace;font-size:13px;font-weight:bold;font-style:italic;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:8px;}
  .task-it{font-size:19px;line-height:1.5;}
  .hint{margin-top:10px;font-size:13px;color:var(--ink-soft);font-style:italic;}

  .feedback{padding:16px 18px;margin-bottom:16px;border-radius:14px;font-size:14.5px;line-height:1.55;border-left:4px solid var(--dot-correct);background:var(--paper-2);animation:cardIn .3s ease;}
  .feedback.wrong{border-left-color:var(--dot-wrong);}
  .feedback .verdict{font-family:'Yuji Boku', 'Courier New', monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;color:var(--dot-correct);}
  .feedback.wrong .verdict{color:var(--dot-wrong);}
  .speak-btn{
    background:none;border:1px solid currentColor;border-radius:16px;
    padding:3px 12px;font-size:11px;font-family:'Yuji Boku', 'Courier New', monospace;
    color:inherit;cursor:pointer;flex:none;transition:background .15s ease;
  }
  .speak-btn:hover{background:rgba(0,0,0,0.06);}
  .jp-answer{font-size:15px;margin-top:6px;color:var(--ink);}

  .pron-result{
    margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13px;
    background:var(--paper); border:1px solid var(--grid);
  }
  .pron-result.match{border-color:var(--dot-correct); color:var(--dot-correct);}
  .pron-result.nomatch{border-color:var(--gold); color:var(--ink-soft);}

  .answer-zone{margin-bottom:14px;}
  textarea, input[type=password]{
    width:100%;background:var(--paper);border:1px solid var(--grid);border-radius:12px;padding:14px;
    font-family:'Yuji Boku', 'Courier New', monospace;font-size:16px;color:var(--ink);resize:none;min-height:60px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input[type=password]{min-height:auto;}
  textarea:focus, input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(156,127,63,0.15);}

  .actions{display:flex;gap:10px;margin-top:10px;}
  button{
    font-family:'Yuji Boku', 'Courier New', monospace;font-size:13px;font-weight:bold;font-style:italic;letter-spacing:0.05em;text-transform:uppercase;
    border-radius:12px;
    padding:13px 18px;border:1px solid var(--blue);background:var(--blue);color:var(--paper);cursor:pointer;flex:1;
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  button:hover:not(:disabled){background:var(--gold);border-color:var(--gold);color:var(--ink);box-shadow:0 3px 10px rgba(218,165,32,0.3);}
  button:active:not(:disabled){transform:scale(0.97);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.secondary{background:transparent;color:var(--ink-soft);border-color:var(--grid);flex:0 0 auto;box-shadow:none;}
  button.secondary:hover{background:var(--paper-2);color:var(--ink);box-shadow:none;}
  button.mic-btn{background:var(--paper-2);color:var(--ink);border-color:var(--grid);flex:0 0 auto;}
  button.mic-btn.recording{background:var(--error);color:var(--paper);border-color:var(--error);}

  .suggest-panel{
    background:var(--paper-2); border:1px dashed var(--gold); border-radius:12px; padding:14px 16px; margin-bottom:16px;
    font-size:13px; color:var(--ink-soft);
  }
  .suggest-panel .label{font-family:'Yuji Boku', 'Courier New', monospace;font-size:11px;color:var(--gold);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;}
  .suggest-word{display:inline-block;background:var(--paper);border:1px solid var(--grid);border-radius:8px;padding:3px 10px;margin:2px 4px 2px 0;font-family:'Yuji Boku', 'Courier New', monospace;font-size:12.5px;color:var(--ink);}

  .loading{text-align:center;padding:30px 0;color:var(--ink-soft);font-family:'Yuji Boku', 'Courier New', monospace;font-size:13px;}
  .dot{animation:blink 1.4s infinite;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}

  .err-box{background:#F6E3DE;border:1px solid var(--error);border-radius:12px;color:var(--error);padding:12px 14px;font-size:13px;margin-bottom:14px;font-family:'Yuji Boku', 'Courier New', monospace;}

  .setup-card{background:var(--paper-2);border:1px solid var(--grid);border-radius:14px;border-left:4px solid var(--gold);padding:22px 20px;margin-bottom:16px;}
  .setup-card p{font-size:14px;line-height:1.6;margin:0 0 12px;}
  .setup-card a{color:var(--blue);}
  .setup-card label{display:block;font-family:'Yuji Boku', 'Courier New', monospace;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}

  /* ===== MENU LATERALE ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(42,38,34,0.45);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  .side-menu{
    position:fixed; top:0; left:0; bottom:0; width:280px; max-width:82vw;
    background:var(--paper); border-right:1px solid var(--grid);
    transform:translateX(-100%); transition:transform .3s cubic-bezier(.34,1.06,.64,1);
    z-index:50; padding:20px 18px; overflow-y:auto; overflow-x:hidden;
  }
  .side-menu.show{transform:translateX(0);}

  .menu-section{
    background:var(--paper-2); border:1px solid var(--grid); border-radius:14px;
    padding:14px 14px 16px; margin:14px 0;
  }
  .menu-section:first-of-type{margin-top:36px;}
  .side-menu h3{
    font-family:'Yuji Boku', 'Courier New', monospace; font-size:14px; letter-spacing:0.04em;
    color:var(--ink-soft); margin:0 0 10px; font-weight:bold; font-style:italic;
  }
  .menu-close{
    background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer;
    float:right; padding:0; width:auto; flex:none;
  }
  .menu-row{display:flex; gap:8px; margin-bottom:2px; min-width:0;}
  .menu-row button{border-radius:10px; padding:10px 8px; font-size:12px; min-width:0; overflow-wrap:break-word; white-space:normal;}
  .menu-row-wrap{flex-wrap:wrap;}
  .menu-row-wrap button{flex:1 1 calc(50% - 4px); min-width:90px;}
  .menu-row button.active-choice{background:var(--blue); color:var(--paper); border-color:var(--blue);}
  .menu-row button.secondary.active-choice{background:var(--blue); color:var(--paper);}

  .menu-search{
    width:100%;margin-bottom:12px;padding:9px 12px;border-radius:10px;
    border:1px solid var(--grid);background:var(--paper);
    font-family:'Yuji Boku', 'Courier New', monospace;font-size:13px;color:var(--ink);
  }
  .search-results{
    background:var(--paper); border:1px dashed var(--gold); border-radius:10px;
    padding:10px 12px; margin-bottom:14px;
  }
  .search-results .label{color:var(--gold); margin-bottom:6px;}
  .search-results .vocab-tags{max-height:none;}

  .vocab-cols-menu .vocab-col{margin-bottom:14px;}
  .vocab-cols-menu .vocab-col:last-child{margin-bottom:0;}
  .vocab-col .label{font-size:11px;font-family:'Yuji Boku', 'Courier New', monospace;color:var(--blue);margin-bottom:6px;letter-spacing:0.05em;}
  .label.collapsible{cursor:pointer; user-select:none; display:flex; align-items:center; gap:4px;}
  .collapse-arrow{display:inline-block; transition:transform .2s ease; font-size:10px;}
  .collapse-arrow.collapsed{transform:rotate(-90deg);}
  .vocab-tags.collapsed{display:none;}
  .vocab-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .vocab-tags.scrollable{
    max-height:150px; overflow-y:auto; padding-right:4px;
    align-content:flex-start;
  }
  .vocab-tags.scrollable::-webkit-scrollbar{width:5px;}
  .vocab-tags.scrollable::-webkit-scrollbar-thumb{background:var(--grid);border-radius:3px;}
  .vocab-count{font-size:10px;color:var(--ink-soft);font-family:'Yuji Boku', 'Courier New', monospace;margin-left:4px;opacity:0.7;}
  .tag{background:var(--paper);border:1px solid var(--grid);border-radius:8px;padding:3px 9px;font-size:12px;font-family:'Yuji Boku', 'Courier New', monospace;color:var(--ink-soft);}
  .tag.active{color:var(--dot-correct);border-color:var(--dot-correct);}

  .menu-footer-btn{width:100%; margin-top:8px;}

  .calendar-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px;}
  .calendar-day{aspect-ratio:1;border-radius:4px;background:var(--grid);}
  .trend-bar-wrap{display:flex; flex-direction:column; align-items:center; height:100%; justify-content:flex-end;}
  .trend-bar{width:100%; border-radius:2px 2px 0 0; background:linear-gradient(180deg, var(--gold), var(--blue)); min-height:2px; transition:height .4s ease;}
  .trend-bar.empty{background:var(--grid);}
  .calendar-day.active{background:var(--blue);}
  .calendar-caption{font-size:10px;color:var(--ink-soft);font-family:'Yuji Boku', 'Courier New', monospace;margin-top:6px;text-align:center;}

  .progress-path{display:flex;align-items:center;overflow-x:auto;padding:6px 2px;gap:0;}
  .path-node-wrap{display:flex;align-items:center;flex:none;}
  .path-node{
    width:30px;height:30px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:'Yuji Boku', 'Courier New', monospace;font-size:11px;font-weight:bold;
    background:var(--grid);color:var(--ink-soft);border:2px solid var(--grid);
    transition:background .3s ease, border-color .3s ease, transform .2s ease;
  }
  .path-node.done{background:var(--blue);border-color:var(--blue);color:var(--paper);}
  .path-node.current{background:var(--paper);border-color:var(--gold);color:var(--gold);transform:scale(1.15);}
  .path-connector{width:16px;height:2px;background:var(--grid);flex:none;}
  .path-connector.done{background:var(--blue);}

  .history-list{max-height:220px; overflow-y:auto;}
  .history-item{
    display:flex; gap:8px; align-items:flex-start; padding:8px 0;
    border-bottom:1px solid var(--grid); font-size:12px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-icon{flex:none; font-size:14px; margin-top:1px;}
  .history-body{flex:1; min-width:0;}
  .history-task{color:var(--ink-soft); font-size:11px; margin-bottom:2px;}
  .history-answer{color:var(--ink); font-family:'Yuji Boku', 'Courier New', monospace; word-break:break-word;}
  .history-empty{color:var(--ink-soft); font-size:12px; text-align:center; padding:10px 0;}
  .weekly-goal-wrap{margin-top:12px;}
  .level-bar-fill.weekly{background:var(--dot-correct);}

  .mode-switch{display:flex;justify-content:center;gap:8px;margin-top:14px;}
  .mode-btn{
    flex:none; background:var(--paper-2); border:1px solid var(--grid); color:var(--ink-soft);
    border-radius:20px; padding:7px 16px; font-size:11px;
  }
  .mode-btn.active-choice{background:var(--blue); border-color:var(--blue); color:var(--paper);}

  .chat-wrap{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .chat-bubble{
    max-width:85%; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.5;
    animation:cardIn .3s ease;
  }
  .chat-bubble.user{align-self:flex-end; background:var(--indigo); color:var(--paper); border-bottom-right-radius:4px;}
  .chat-bubble.ai{align-self:flex-start; background:var(--paper-2); border:1px solid var(--grid); border-bottom-left-radius:4px;}
  .chat-bubble .chat-jp{font-size:15px; margin-bottom:2px;}
  .chat-bubble .chat-romaji{font-family:'Yuji Boku', 'Courier New', monospace; font-size:12px; opacity:0.85;}
  .chat-bubble .chat-note{margin-top:6px; font-size:12px; font-style:italic; opacity:0.85; border-top:1px dashed currentColor; padding-top:6px;}
  .chat-bubble .chat-speak{margin-top:6px;}
  .chat-empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px;}

  .review-btn-wrap{margin-bottom:16px;}
  .review-btn{background:var(--indigo);border-color:var(--indigo);}
  .review-btn:hover{background:var(--maroon);border-color:var(--maroon);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px;
    font-family:'Yuji Boku', 'Courier New', monospace; font-size:12px; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .reminder-note{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:6px;}

  footer{display:none;}

  /* ===== ECCEZIONE: contenuto di apprendimento resta leggibile =====
     Frase esercizio, correzioni, vocabolario, chat, cronologia e campi
     di digitazione usano uno stile giapponese più sobrio (Shippori Mincho),
     non il pennello grassetto/corsivo usato per il resto dell'interfaccia. */
  .task-it, .hint, .feedback, .jp-answer,
  .tag, .suggest-word,
  .chat-bubble .chat-jp, .chat-bubble .chat-romaji, .chat-bubble .chat-note,
  .history-task, .history-answer,
  textarea, input[type="text"], input[type="password"] {
    font-family:'Shippori Mincho', Georgia, serif;
    font-weight:400;
    font-style:normal;
  }
  .hint, .chat-bubble .chat-note{ font-style:italic; } /* enfasi originale mantenuta */
  .no-italic{font-style:normal !important; font-weight:normal !important; display:inline-block;}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<nav class="side-menu" id="sideMenu">
  <button class="menu-close" id="menuClose" aria-label="Chiudi menu / Close menu">✕</button>

  <div class="menu-section">
    <h3 id="menuLangTitle">🌐 Lingua / Language</h3>

function CURRICULUM_SYSTEM_FOR(){
  return `Sei il motore didattico di un'app per imparare il giapponese parlato/scritto in romaji, con obiettivo di portare lo studente da zero a un livello B2/C1 nel tempo. Lo studente ama anime/manga.

METODO FISSO — non deviare mai:
- Niente teoria esplicita, niente liste passive di vocaboli. Ogni turno è un compito di PRODUZIONE ATTIVA: dai un compito, lo studente scrive la frase in giapponese romaji, tu correggi.
- Il feedback deve essere breve (2-3 righe MASSIMO), specifico, diretto, come un insegnante dal vivo che corregge sul momento — mai un saggio, mai elenco di regole.
- ${t('langInstruction')}
- IMPORTANTE per la pronuncia (campo "correct_answer_jp"): questo campo deve SEMPRE contenere la versione in caratteri giapponesi reali (hiragana/katakana/kanji) della frase CORRETTA relativa alla RISPOSTA CHE LO STUDENTE HA APPENA SCRITTO in questo turno (quella che stai correggendo ora) — MAI la frase del nuovo esercizio che stai per proporre. Se è il primissimo turno (nessuna risposta precedente da correggere), lascia questo campo null.

CURRICULUM GRAMMATICALE (sblocco progressivo, dal più semplice al più complesso, copre l'intera progressione fino a B2/C1). Sblocca uno step successivo solo quando l'ultimo padroneggiato ha un tasso di correttezza alto nelle ultime risposte; una volta sbloccato uno step resta mescolato con tutti i precedenti, mai a compartimenti stagni:
1. Schema base: [soggetto] wa [oggetto] o [verbo]-masu
2. Domande con ka, omissione soggetto quando ovvio dal contesto
3. Parole interrogative: nani, dare, doko, itsu, naze; nani no X
4. Passato (-mashita) e negazione (-masen, -masendeshita)
5. Aggettivi i e na (con desu/na), comparativi (yori), superlativi (ichiban)
6. Connettivi: sorekara, demo, node, kedo
7. Forma -te (richieste, azioni collegate, progressivo -te imasu)
8. Forme piane (dizionario/nai) accanto a -masu, per il registro informale
9. Condizionale (-tara, -ba), volitivo, passivo/causativo di base
10. Costruzioni complesse: to omoimasu, to iimashita, keigo di base (B2+)

VOCABOLARIO — crescita verso B2/C1:
- Introduci vocaboli nuovi seguendo la frequenza d'uso reale in giapponese (logica JLPT N5→N4→N3→N2→N1), mai parole a caso o troppo rare per il livello attuale.
- Organizza per campi semantici utili a conversazioni reali, così le frasi restano tematicamente coerenti.
- Introduci circa 1-3 parole nuove per turno quando lo studente sta andando bene, non di più.
- Una parola nuova va usata/vista in almeno 3 esercizi diversi prima di poter essere spostata da "vocab_new" a "vocab_learned".
- Le parole sbagliate di recente devono ripresentarsi più spesso nei prossimi esercizi.
- Man mano che il livello sale, proponi anche mini-dialoghi (3-4 scambi in sequenza).
- Quando proponi un esercizio, se possibile riusa almeno una parola tra quelle "in apprendimento" per rinforzarla.

REGISTRO OUTPUT: rispondi SEMPRE E SOLO con un oggetto JSON valido, struttura esatta:
{
  "feedback": string o null,
  "correct": boolean o null,
  "heard_romaji": string o null (SOLO quando la risposta dello studente e' un audio allegato, non testo: scrivi qui la trascrizione in romaji di quello che hai capito abbia detto, per mostrargliela. Se non capisci nulla di comprensibile nell'audio, lascia null e imposta correct:false con un feedback che spiega che l'audio non era chiaro. Se la risposta era testo, lascia sempre null),
  "vocab_learned": array di stringhe,
  "vocab_new": array di stringhe (formato OBBLIGATORIO SEMPRE BILINGUE, indipendentemente dalla lingua scelta per feedback/esercizi: "giapponese-romaji = traduzione italiana / English translation", es. "hon = libro / book"),
  "grammar_unlocked": string o null,
  "level_label": string,
  "next_exercise_it": string,
  "next_exercise_hint": string,
  "correct_answer_jp": string o null (versione giapponese reale della risposta CORRETTA appena data dallo studente, MAI del nuovo esercizio; null al primo turno)
}`;
}

function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
// Deve essere chiamata SINCRONAMENTE dentro un gestore di click/tap,
// altrimenti i browser mobile bloccano l'audio creato dopo un'attesa asincrona (fetch).
function ensureAudioUnlocked(){
  try{
    const ctx = getAudioCtx();
    if(ctx.state === 'suspended') ctx.resume();
  }catch(e){}
}
function playTone(freqs, duration, type, volume, stagger){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx();
    const vol = volume || 0.12;
    const gap = stagger === undefined ? 0.08 : stagger;
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + i * gap + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * gap + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * gap);
      osc.stop(ctx.currentTime + duration + i * gap + 0.05);
    });
  }catch(e){}
}
// Suono di risposta corretta: arpeggio brillante e squillante, più presente del precedente.
function playCorrectSound(){
  playTone([784.0, 987.77, 1318.51], 0.3, 'triangle', 0.22, 0.075);
}
// Suono di risposta sbagliata: buzz secco a due toni, più marcato e riconoscibile.
function playWrongSound(){
  playTone([196, 174.61], 0.32, 'sawtooth', 0.18, 0.11);
}
// Piccolo "tap" istantaneo al tocco del pulsante, per conferma immediata
// mentre si aspetta la risposta effettiva (che richiede la chiamata di rete).
function playTapSound(){
  playTone([440], 0.06, 'sine', 0.08, 0);
}

function speakJapanese(text){
  if(!text || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.85;
    const voices = window.speechSynthesis.getVoices();
    const jpVoice = voices.find(v => v.lang && v.lang.startsWith('ja'));
    if(jpVoice) utter.voice = jpVoice;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

// ===== MICROFONO: registrazione audio reale, trascritta da Gemini =====
// Il riconoscimento vocale integrato del browser (SpeechRecognition) e' noto per
// non funzionare in modo affidabile dentro le WebView/TWA: cattura l'audio ma la
// trascrizione (che richiede un servizio online) spesso fallisce in silenzio.
// Registriamo quindi l'audio grezzo e lo mandiamo a Gemini per la trascrizione,
// riusando la stessa API key gia' in uso per correggere gli esercizi.

function pickSupportedMimeType(){
  const candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/mp4'];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const result = reader.result || '';
      const base64 = result.split(',')[1] || '';
      resolve(base64);
    };
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

function stopMicStream(){
  if(micStream){
    micStream.getTracks().forEach(tr => tr.stop());
    micStream = null;
  }
}

// Primo tocco: avvia la registrazione. Secondo tocco (stesso pulsante): la ferma
// e manda l'audio DIRETTAMENTE come risposta (esercizio) o messaggio (chat) a
// Gemini, che in un'unica chiamata trascrive E valuta/risponde - niente passaggio
// intermedio di testo da rileggere e confermare.
async function toggleVoiceInputInto(targetId){
  if(isTranscribing) return;

  if(isRecording){
    if(mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
    pronResult = { unsupported: true };
    render();
    return;
  }

  try{
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    pronResult = { unsupported: true };
    render();
    return;
  }

  const mimeType = pickSupportedMimeType();
  audioChunks = [];
  try{
    mediaRecorder = mimeType ? new MediaRecorder(micStream, { mimeType }) : new MediaRecorder(micStream);
  }catch(e){
    stopMicStream();
    pronResult = { unsupported: true };
    render();
    return;
  }

  mediaRecorder.ondataavailable = (e) => { if(e.data && e.data.size > 0) audioChunks.push(e.data); };

  mediaRecorder.onstop = async () => {
    stopMicStream();
    isRecording = false;
    isTranscribing = true;
    pronResult = null;
    render();

    const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || mimeType || 'audio/webm' });
    const usedMimeType = mediaRecorder.mimeType || mimeType;

    if(targetId === 'chatInput'){
      await sendChatAudioMessage(blob, usedMimeType);
    } else {
      await fetchNext('[audio]', false, 0, { blob, mimeType: usedMimeType });
    }
    isTranscribing = false;
  };

  isRecording = true;
  pronResult = null;
  render();
  mediaRecorder.start();
}

async function callGeminiRaw(userMsg, systemPrompt, extraParts){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 25000);
  try{
    const parts = [{ text: userMsg }, ...(extraParts || [])];
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role:'user', parts }],
        generationConfig: { responseMimeType: 'application/json', maxOutputTokens: 3000 }
      }),
      signal: controller.signal
    });
    if(!res.ok){
      const errText = await res.text();
      console.error('Errore API Gemini (grezzo):', res.status, errText);
      if(res.status === 429) throw new Error(t('errQuota'));
      if(res.status === 401) throw new Error(t('errApiKey'));
      throw new Error(t('errServer'));
    }
    const data = await res.json();
    if(!data.candidates || !data.candidates.length) throw new Error(t('errEmpty'));
    const text = data.candidates[0].content.parts.map(p => p.text || '').join('');
    return extractJson(text);
  } catch(e){
    if(e.name === 'AbortError') throw new Error(t('errTimeout'));
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
}
async function callGemini(userMsg, extraParts){
  return callGeminiRaw(userMsg, CURRICULUM_SYSTEM_FOR(), extraParts);
}

function extractJson(text){
  const start = text.indexOf('{');
  if(start === -1){
    console.error('Nessun JSON nella risposta (grezzo):', text);
    throw new Error(t('errParse'));
  }
  let depth = 0, inString = false, escape = false;
  for(let i = start; i < text.length; i++){
    const ch = text[i];
    if(inString){
      if(escape) escape = false;
      else if(ch === '\\') escape = true;
      else if(ch === '"') inString = false;
    } else {
      if(ch === '"') inString = true;
      else if(ch === '{') depth++;
      else if(ch === '}'){
        depth--;
        if(depth === 0){
          try{
            return JSON.parse(text.slice(start, i + 1));
          } catch(parseErr){
            console.error('JSON malformato (grezzo):', text, parseErr);
            throw new Error(t('errParse'));
          }
        }
      }
    }
  }
  console.error('JSON incompleto/troncato (grezzo):', text);
  throw new Error(t('errParse'));
}

// ===== RIPETIZIONE DILAZIONATA (SM-2 semplificato, stile Anki) =====
// Ogni parola ha: interval (giorni prima del prossimo ripasso), ease (facilita'
// personale, parte da 2.5 e si aggiusta), reps (ripassi consecutivi riusciti),
// nextReview (timestamp del prossimo ripasso dovuto).
function srsKey(vocabEntry){
  // Usa solo la parte giapponese/romaji come chiave stabile, non la traduzione intera
  return (vocabEntry || '').split('=')[0].trim().toLowerCase();
}
function srsInit(vocabEntry){
  const key = srsKey(vocabEntry);
  if(!key) return;
  if(!state.srsData[key]){
    state.srsData[key] = { interval: 1, ease: 2.5, reps: 0, nextReview: Date.now() + 24*60*60*1000, lastReviewed: null };
  }
}
function srsReview(vocabEntry, correct){
  const key = srsKey(vocabEntry);
  if(!key) return;
  let entry = state.srsData[key] || { interval: 1, ease: 2.5, reps: 0, nextReview: Date.now(), lastReviewed: null };
  if(!correct){
    entry.reps = 0;
    entry.interval = 1;
    entry.ease = Math.max(1.3, entry.ease - 0.2);
  } else {
    entry.reps++;
    if(entry.reps === 1) entry.interval = 1;
    else if(entry.reps === 2) entry.interval = 6;
    else entry.interval = Math.round(entry.interval * entry.ease);
    entry.ease = Math.min(2.8, entry.ease + 0.1);
  }
  entry.lastReviewed = Date.now();
  entry.nextReview = Date.now() + entry.interval * 24*60*60*1000;
  state.srsData[key] = entry;
}
function srsPromote(vocabEntry){
  // Una parola passata da "in apprendimento" ad "attiva": trattata come ripasso riuscito forte
  srsInit(vocabEntry);
  srsReview(vocabEntry, true);
}
// Sceglie le parole piu' scadute (o mai ripassate) tra quelle in apprendimento
function srsDueWords(limit){
  if(!state.learningVocab || !state.learningVocab.length) return [];
  const now = Date.now();
  const withDue = state.learningVocab.map(w => {
    const key = srsKey(w);
    const entry = state.srsData[key];
    const due = entry ? entry.nextReview : 0; // mai vista prima = massima priorita'
    return { word: w, due };
  });
  withDue.sort((a,b) => a.due - b.due);
  return withDue.slice(0, limit || 3).map(x => x.word);
}

}
function getPendingAnswer(){

    const raw = localStorage.getItem(PENDING_KEY);

  }catch(e){ return null; }
}

}
async function retryPendingAnswerIfAny(){

async function bootstrap(){
  loadSoundPref();
  loadThemePref();
  loadTextSizePref();
  loadLangPref();
  loadModePref();
  applyStaticTexts();
  renderMenuChoices();
  updateModeButtons();
  apiKey = getApiKey();
  if(!apiKey){ renderSetup(); return; }
  const had = loadState();
  if(!had){
    state = defaultState();
    fetchNext(null);
    // Cane da guardia: controlla ogni 4 secondi se siamo ancora bloccati (anche
    // nel caso limite in cui la richiesta di rete non si risolve né fallisce
    // mai), e forza un nuovo tentativo da solo, ripetendo il controllo finché
    // non arriva davvero un esercizio - non solo una volta, così anche se il
    // tentativo di recupero si blocca a sua volta, l'app continua a riprovare
    // senza mai richiedere il tocco manuale dell'utente.
    let watchdogChecks = 0;
    const watchdog = setInterval(() => {
      watchdogChecks++;
      if(state && state.currentExercise){
        clearInterval(watchdog);
        return;
      }
      if(watchdogChecks > 10){ clearInterval(watchdog); return; } // limite di sicurezza, ~40s
      if(uiState.loading){
        fetchNext(null);
      }
    }, 4000);
  } else { uiState.loading = false; render(); checkAchievements(); renderAchievements(); }
  setTimeout(checkReminderNow, 1500);
  window.addEventListener('online', retryPendingAnswerIfAny);
}

async function fetchNext(userAnswer, forceReviewMode, autoRetryCount, audioPayload){
  autoRetryCount = autoRetryCount || 0;
  lastAnswerSent = userAnswer;
  lastAudioPayload = audioPayload || null;
  pronResult = null;
  uiState.loading = true; uiState.error = null; render();

  const profileSummary = {
    level_label: state.levelLabel, active_vocab: state.activeVocab, learning_vocab: state.learningVocab,
    grammar_unlocked: state.grammarUnlocked, streak: state.streak, total_correct: state.totalCorrect, total_attempts: state.totalAttempts
  };

  let userMsg;
  let extraParts = [];
  if(forceReviewMode){
    const dueWords = srsDueWords(3);
    state.currentReviewWords = dueWords;
    userMsg = `Profilo studente attuale: ${JSON.stringify(profileSummary)}.
Lo studente ha chiesto esplicitamente una sessione di RIPASSO MIRATO. Crea un esercizio che usi il più possibile queste parole specifiche (le più urgenti da ripassare): ${JSON.stringify(dueWords)}. Non introdurre vocaboli nuovi in questo turno. feedback e correct devono essere null (è un nuovo esercizio, non una correzione).`;
  } else if(audioPayload){
    userMsg = `Profilo studente attuale: ${JSON.stringify(profileSummary)}.
Esercizio dato: "${state.currentExercise.it}" (hint: "${state.currentExercise.hint}")
Lo studente ha risposto con un messaggio VOCALE, allegato come audio a questo messaggio. Ascoltalo, trascrivilo (campo "heard_romaji") e valutalo come risposta all'esercizio secondo le regole del sistema, esattamente come faresti con una risposta testuale.`;
    const base64Audio = await blobToBase64(audioPayload.blob);
    extraParts = [{ inline_data: { mime_type: audioPayload.mimeType || 'audio/webm', data: base64Audio } }];
  } else {
    userMsg = userAnswer === null
      ? `Primo avvio. Profilo studente: ${JSON.stringify(profileSummary)}. Dammi il primo esercizio (feedback e correct devono essere null).`
      : `Profilo studente attuale: ${JSON.stringify(profileSummary)}.
Esercizio dato: "${state.currentExercise.it}" (hint: "${state.currentExercise.hint}")
Risposta dello studente in romaji: "${userAnswer}"
Valuta la risposta e dammi il prossimo esercizio secondo le regole del sistema.`;
  }

  try{
    const result = await callGemini(userMsg, extraParts);
    const effectiveAnswer = audioPayload ? (result.heard_romaji || t('audioNonChiaro')) : userAnswer;

    if(userAnswer !== null || audioPayload){
      state.totalAttempts++;
      bumpDailyCounter();
      state.recentResults.push(!!result.correct);
      if(state.recentResults.length > 10) state.recentResults.shift();

      if(result.correct){
        state.totalCorrect++; state.streak++;
        if(state.streak > state.bestStreak) state.bestStreak = state.streak;
        uiState.showStamp = true;
        playCorrectSound();
      } else {
        state.streak = 0;
        playWrongSound();
      }
      state.pendingFeedback = result.feedback; state.pendingCorrect = result.correct;
      state.pendingJpAnswer = result.correct_answer_jp || null;
      state.pendingHeardRomaji = audioPayload ? effectiveAnswer : null;
      pushHistory({
        task: state.currentExercise ? state.currentExercise.it : '',
        answer: effectiveAnswer,
        correct: !!result.correct,
        feedback: result.feedback,
        jp: result.correct_answer_jp || null,
        date: new Date().toISOString()
      });

      // Precisione giornaliera, per il grafico d'andamento
      const todayKey = new Date().toDateString();
      state.dailyCorrect[todayKey] = (state.dailyCorrect[todayKey] || 0) + (result.correct ? 1 : 0);

      // Se questo esercizio era un ripasso mirato, valuto le parole coinvolte via SRS
      if(state.currentReviewWords && state.currentReviewWords.length){
        state.currentReviewWords.forEach(w => srsReview(w, !!result.correct));
        state.currentReviewWords = null;
      }
    } else {
      state.pendingFeedback = null; state.pendingCorrect = null; state.pendingJpAnswer = null; state.pendingHeardRomaji = null;
    }

    if(result.vocab_new && result.vocab_new.length){
      result.vocab_new.forEach(v => {
        if(!state.learningVocab.includes(v) && !state.activeVocab.includes(v)){
          state.learningVocab.push(v);
          srsInit(v);
        }
      });
    }
    if(result.vocab_learned && result.vocab_learned.length){
      result.vocab_learned.forEach(v => {
        state.learningVocab = state.learningVocab.filter(x => x !== v);
        if(!state.activeVocab.includes(v)) state.activeVocab.push(v);
        srsPromote(v);
      });
    }
    if(result.grammar_unlocked && !state.grammarUnlocked.includes(result.grammar_unlocked)){
      state.grammarUnlocked.push(result.grammar_unlocked);
    }
    if(result.level_label) state.levelLabel = result.level_label;

    state.currentExercise = { it: result.next_exercise_it, hint: result.next_exercise_hint };
    saveState();
    clearPendingAnswer();
    checkAchievements();
  }catch(e){
    const isOffline = !navigator.onLine || e.message === 'Failed to fetch' || e.name === 'TypeError';
    if(isOffline && userAnswer !== null && !forceReviewMode){
      savePendingAnswer(userAnswer);
      uiState.error = t('errOffline');
      console.error(e);
    } else {
      console.error(e);

      // Retry automatico e silenzioso per gli errori tecnici transitori (risposta
      // malformata/troncata, intoppo temporaneo del server) - succede sia al primo
      // caricamento sia quando si corregge una risposta gia' data. Esclude gli
      // errori che un ritentativo non risolverebbe comunque (quota, api key, offline).
      const isTransient = e.message === t('errParse') || e.message === t('errServer') || e.message === t('errTimeout') || e.message === t('errEmpty');
      const nonRetryable = e.message === t('errQuota') || e.message === t('errApiKey');
      // Al primo avvio (nessun esercizio ancora mostrato) ritentiamo su QUALSIASI
      // errore tranne quota/api-key, perché non c'e' nulla da perdere: l'utente
      // non ha ancora visto niente, meglio un altro tentativo silenzioso che un
      // messaggio d'errore secco appena aperta l'app.
      const shouldRetry = isTransient || (userAnswer === null && !nonRetryable);
      if(shouldRetry && autoRetryCount < 3){
        uiState.error = null;
        uiState.loading = true; render();
        setTimeout(() => { fetchNext(userAnswer, forceReviewMode, autoRetryCount + 1); }, 1500);
        return;
      }
      uiState.error = e.message;
    }
  }
  uiState.loading = false; render();
}

${recentTurns}

L'ultimo messaggio dello studente è un audio allegato, non testo. Ascoltalo, trascrivilo (campo "heard_romaji") e rispondi continuando la conversazione naturalmente, come se lo studente avesse scritto quella trascrizione.`;

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const imported = JSON.parse(ev.target.result);
      if(!imported || typeof imported !== 'object' || !('activeVocab' in imported)){
        throw new Error('formato non valido');
      }
      state = imported;
      if(!state.activityDates) state.activityDates = [];
      if(!state.recentResults) state.recentResults = [];
      saveState();
      closeMenu();
      render();
      showToast(t('importSuccess'));
    }catch(err){
      showToast(t('importError'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

const REMINDER_KEY = 'nihongo-reminder-enabled';
function isReminderEnabled(){ return localStorage.getItem(REMINDER_KEY) === '1'; }
async function enableReminder(){
  if(!('Notification' in window)){
    showToast(t('reminderPermissionDenied'));
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){
    showToast(t('reminderPermissionDenied'));
    return;
  }
  localStorage.setItem(REMINDER_KEY, '1');
  renderMenuChoices();
  checkReminderNow();
}
function disableReminder(){
  localStorage.setItem(REMINDER_KEY, '0');
  renderMenuChoices();
}
function checkReminderNow(){
  if(!isReminderEnabled() || !('Notification' in window) || Notification.permission !== 'granted') return;
  if(!state) return;
  const today = new Date().toDateString();
  const doneToday = state.lastActiveDate === today && state.exercisesToday > 0;
  if(!doneToday){
    try{
      new Notification(t('reminderMsgTitle'), { body: t('reminderMsgBody'), icon: 'icon-192.png' });
    }catch(e){}
  }
}

  if(chatLoading){
    html += `<div class="chat-bubble ai loading" style="padding:10px 14px;">${t('thinking')}<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>`;
  }
  html += `</div>`;

  html += `<div class="answer-zone"><textarea id="chatInput" placeholder="${t('chatPlaceholder')}"></textarea></div>
  <div class="actions">
    <button id="chatSendBtn" ${chatLoading ? 'disabled' : ''}>${t('invia')}</button>
    ${micButtonHtml('chatMicBtn')}
  </div>`;

  app.innerHTML = html;

  document.querySelectorAll('[data-chat-speak]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-chat-speak'), 10);
      const msg = state.chatMessages[idx];
      if(msg && msg.text_jp) speakJapanese(msg.text_jp);
    });
  });

  const sendBtn = document.getElementById('chatSendBtn');
  if(sendBtn) sendBtn.addEventListener('click', sendChatMessage);

  const chatMicBtn = document.getElementById('chatMicBtn');
  if(chatMicBtn) chatMicBtn.addEventListener('click', startVoiceChatInput);

  const chatInput = document.getElementById('chatInput');
  if(chatInput){
    chatInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(); }
    });
    if(!chatLoading) chatInput.focus();
  }

  const wrap = document.getElementById('chatWrap');
  if(wrap) wrap.scrollTop = wrap.scrollHeight;
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(!list || !state) return;
  if(!state.history || !state.history.length){
    list.innerHTML = `<div class="history-empty">${t('cronologiaVuota')}</div>`;
    return;
  }
  list.innerHTML = state.history.map(h => `
    <div class="history-item">
      <span class="history-icon no-italic">${h.correct ? '✅' : '❌'}</span>
      <div class="history-body">
        <div class="history-task">${escapeHtml(h.task || '')}</div>
        <div class="history-answer">${escapeHtml(h.answer || '')}</div>
      </div>
    </div>
  `).join('');
}

function renderAchievements(){
  const list = document.getElementById('achievementsList');
  if(!list || !state) return;
  const unlocked = state.unlockedAchievements || [];
  list.innerHTML = ACHIEVEMENTS.map(a => {
    const isUnlocked = unlocked.includes(a.id);
    const title = uiLang === 'it' ? a.titleIt : a.titleEn;
    const desc = uiLang === 'it' ? a.descIt : a.descEn;
    return `
    <div class="history-item" style="opacity:${isUnlocked ? 1 : 0.4};">
      <span class="history-icon no-italic">${isUnlocked ? a.icon : '🔒'}</span>
      <div class="history-body">
        <div class="history-task">${escapeHtml(title)}</div>
        <div class="history-answer">${escapeHtml(desc)}</div>
      </div>
    </div>`;
  }).join('');
}

function renderVocabTags(){
  const activeTags = document.getElementById('activeTags');
  const learningTags = document.getElementById('learningTags');
  const activeCount = document.getElementById('activeCount');
  const searchResults = document.getElementById('searchResults');
  const searchResultsTags = document.getElementById('searchResultsTags');
  const searchResultsLabel = document.getElementById('searchResultsLabel');
  if(!state || !activeTags || !learningTags) return;

  // Le due sezioni mostrano SEMPRE la lista completa, non filtrata:
  // il loro stato aperto/chiuso dipende solo dal click dell'utente, mai dalla ricerca.
  activeTags.innerHTML = state.activeVocab.map(v => `<span class="tag active">${escapeHtml(v)}</span>`).join('') || '<span class="tag">—</span>';
  learningTags.innerHTML = state.learningVocab.length
    ? state.learningVocab.map(v => `<span class="tag">${escapeHtml(v)}</span>`).join('')
    : '<span class="tag">—</span>';
  if(activeCount) activeCount.textContent = ` (${state.activeVocab.length})`;
  applyVocabCollapseVisual();

  // La ricerca vive per conto suo, in un riquadro separato, senza toccare le sezioni sopra.
  if(searchResults && searchResultsTags && searchResultsLabel){
    const term = vocabSearchTerm.trim();
    if(!term){
      searchResults.style.display = 'none';
    } else {
      searchResults.style.display = 'block';
      const activeMatches = filterVocab(state.activeVocab);
      const learningMatches = filterVocab(state.learningVocab);
      const allMatches = [
        ...activeMatches.map(v => ({ v, active: true })),
        ...learningMatches.map(v => ({ v, active: false }))
      ];
      searchResultsLabel.textContent = `🔍 ${allMatches.length} ${t('risultatiTrovati')}`;
      searchResultsTags.innerHTML = allMatches.length
        ? allMatches.map(({v, active}) => `<span class="tag ${active ? 'active' : ''}">${escapeHtml(v)}</span>`).join('')
        : `<span class="tag">${t('nessunRisultato')}</span>`;
    }
  }
}

// Le sezioni "attivo"/"in apprendimento" restano aperte o chiuse solo in base
// alla preferenza manuale dell'utente — la ricerca non le tocca mai.
function applyVocabCollapseVisual(){
  ['activeTags', 'learningTags'].forEach(targetId => {
    const target = document.getElementById(targetId);
    const arrowId = targetId === 'activeTags' ? 'arrowActive' : 'arrowLearning';
    const arrow = document.getElementById(arrowId);
    if(!target) return;
    const shouldCollapse = vocabCollapsedState[targetId];
    target.classList.toggle('collapsed', shouldCollapse);
    if(arrow) arrow.classList.toggle('collapsed', shouldCollapse);
  });
}

// Cerca un termine sia nella parte giapponese/romaji sia nella traduzione,
// case-insensitive, in qualsiasi lingua sia stata salvata la voce.
function filterVocab(list){
  if(!vocabSearchTerm.trim()) return list;
  const q = vocabSearchTerm.trim().toLowerCase();
  return list.filter(entry => entry.toLowerCase().includes(q));
}

function renderPronResult(){
  if(!pronResult) return '';
  if(pronResult.unsupported){
    return `<div class="pron-result nomatch">${t('micNotSupported')}</div>`;
  }
  if(pronResult.noResult){
    return `<div class="pron-result nomatch">${t('micNoResult')}</div>`;
  }
  if(pronResult.matched){
    return `<div class="pron-result match">✓ ${t('pronMatch')} <em>"${escapeHtml(pronResult.heard)}"</em></div>`;
  }
  return `<div class="pron-result nomatch">${t('pronOff')} <em>"${escapeHtml(pronResult.heard)}"</em></div>`;
}

// Isola ogni emoji in un contenitore che ignora il grassetto/corsivo del
// testo circostante (alcuni browser Android inclinano anche i glifi emoji).
function wrapIcons(str){
  if(!str) return str;
  return str.replace(/([\u{2190}-\u{21FF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{1F000}-\u{1FAFF}])(\u{FE0F})?/gu, '<span class="no-italic">$1$2</span>');
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {
      // se la registrazione fallisce (es. server non lo serve ancora), l'app
      // funziona comunque normalmente, semplicemente senza cache offline
    });
  });
}
