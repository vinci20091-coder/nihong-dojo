<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nihongo Dōjō</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Ronin&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3EFE3;
    --paper-2:#EBE5D3;
    --ink:#2A2622;
    --ink-soft:#5C5546;
    --grid:#D9CFB4;
    --red:#AE3B2E;
    --red-soft:#C7594A;
    --moss:#4B5A3A;
    --gold:#9C7F3F;
    --error:#8C3B2A;
    --teal:#2E6E63;
    --indigo:#48507E;
    --maroon:#7A2438;
  }
  [data-theme="dark"]{
    --paper:#1E1B18;
    --paper-2:#28241F;
    --ink:#EDE6D6;
    --ink-soft:#B3A996;
    --grid:#3A342C;
    --red:#D2564A;
    --red-soft:#E07A6E;
    --moss:#7FA066;
    --gold:#D4B36A;
    --error:#E2695C;
    --teal:#5CB3A1;
    --indigo:#8890C4;
    --maroon:#C9677E;
  }
  body{transition:background-color .3s ease, color .3s ease;}
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper);
    background-attachment: fixed;
    color:var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
    min-height:100vh;
    padding:24px 16px 60px;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{max-width:640px;margin:0 auto;}

  header{text-align:center;margin-bottom:18px;position:relative;}
  .menu-btn{
    position:absolute; top:0; left:0;
    background:var(--paper-2); border:1px solid var(--grid); border-radius:12px;
    width:40px; height:40px; padding:0; flex:none;
    font-size:16px; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .menu-btn:hover{background:var(--red); color:var(--paper); border-color:var(--red);}

  .kanji-mark{
    font-size:17px;letter-spacing:0.4em;color:var(--gold);
    text-transform:uppercase;font-family:'Ronin', 'Shippori Mincho', Georgia, serif;
  }
  h1{font-size:36px;margin:6px 0 2px;font-weight:700;letter-spacing:0.03em;font-family:'Ronin', 'Shippori Mincho', Georgia, serif;}
  h1 .accent{color:var(--red);}
  .subtitle{font-size:13px;color:var(--ink-soft);font-family:'Courier New', monospace;letter-spacing:0.05em;}

  .level-bar-wrap{max-width:400px;margin:14px auto 0;}
  .level-bar-track{height:6px; background:var(--grid); border-radius:3px; overflow:hidden;}
  .level-bar-fill{height:100%; background:linear-gradient(90deg, var(--gold), var(--red)); border-radius:3px; transition:width .6s ease;}
  .level-bar-label{font-family:'Courier New', monospace; font-size:10px; color:var(--ink-soft); text-align:center; margin-top:5px; letter-spacing:0.05em;}

  .stats-row{display:flex;gap:8px;justify-content:center;margin:16px 0 8px;flex-wrap:wrap;}
  .stat{
    border-radius:12px;padding:8px 14px;font-family:'Courier New', monospace;font-size:11px;
    text-align:center;min-width:80px;border:1px solid transparent;
  }
  .stat b{display:block;font-size:19px;font-family:Georgia,serif;margin-bottom:1px;}
  .stat.c-gold{background:#F1E6C9;border-color:#D9C387;color:#8A6D2E;}
  .stat.c-gold b{color:#8A6D2E;}
  .stat.c-red{background:#F5DAD5;border-color:#E0AFA5;color:var(--red);}
  .stat.c-red b{color:var(--red);}
  .stat.c-maroon{background:#EBD3D9;border-color:#D3A5B0;color:var(--maroon);}
  .stat.c-maroon b{color:var(--maroon);}
  .stat.c-teal{background:#D9EAE5;border-color:#A9CFC4;color:var(--teal);}
  .stat.c-teal b{color:var(--teal);}
  .stat.c-indigo{background:#DEE0EE;border-color:#B4B9DA;color:var(--indigo);}
  .stat.c-indigo b{color:var(--indigo);}
  .stat.c-moss{background:#DEE6D4;border-color:#B4C6A2;color:var(--moss);}
  .stat.c-moss b{color:var(--moss);}

  .streak-dots{display:flex;justify-content:center;gap:5px;margin:6px 0 4px;}
  .streak-dot{width:9px;height:9px;border-radius:50%;background:var(--grid);}
  .streak-dot.correct{background:var(--moss);}
  .streak-dot.wrong{background:var(--error);}

  .stamp{
    position:relative;width:80px;height:80px;border-radius:50%;
    border:3px solid var(--red);color:var(--red);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    font-family:'Courier New', monospace;font-size:11px;margin:0 auto 8px;
    transform:rotate(-8deg) scale(0);opacity:0;
    transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .stamp.show{opacity:1;transform:rotate(-8deg) scale(1);}
  .stamp b{font-size:26px;font-family:Georgia,serif;}

  .card{background:var(--paper-2);border:1px solid var(--grid);border-radius:14px;border-left:4px solid var(--red);padding:22px 20px;margin-bottom:16px;animation:cardIn .35s ease;}
  @keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .card .eyebrow{font-family:'Ronin', 'Courier New', monospace;font-size:13px;letter-spacing:0.06em;color:var(--ink-soft);margin-bottom:8px;}
  .task-it{font-size:19px;line-height:1.5;}
  .hint{margin-top:10px;font-size:13px;color:var(--ink-soft);font-style:italic;}

  .feedback{padding:16px 18px;margin-bottom:16px;border-radius:14px;font-size:14.5px;line-height:1.55;border-left:4px solid var(--moss);background:#EEEADB;animation:cardIn .3s ease;}
  .feedback.wrong{border-left-color:var(--error);}
  .feedback .verdict{font-family:'Courier New', monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;color:var(--moss);}
  .feedback.wrong .verdict{color:var(--error);}
  .speak-btn{
    background:none;border:1px solid currentColor;border-radius:16px;
    padding:3px 12px;font-size:11px;font-family:'Courier New', monospace;
    color:inherit;cursor:pointer;flex:none;transition:background .15s ease;
  }
  .speak-btn:hover{background:rgba(0,0,0,0.06);}
  .jp-answer{font-size:15px;margin-top:6px;color:var(--ink);}

  .pron-result{
    margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13px;
    background:var(--paper); border:1px solid var(--grid);
  }
  .pron-result.match{border-color:var(--moss); color:var(--moss);}
  .pron-result.nomatch{border-color:var(--gold); color:var(--ink-soft);}

  .answer-zone{margin-bottom:14px;}
  textarea, input[type=password]{
    width:100%;background:var(--paper);border:1px solid var(--grid);border-radius:12px;padding:14px;
    font-family:'Courier New', monospace;font-size:16px;color:var(--ink);resize:none;min-height:60px;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  input[type=password]{min-height:auto;}
  textarea:focus, input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(156,127,63,0.15);}

  .actions{display:flex;gap:10px;margin-top:10px;}
  button{
    font-family:'Courier New', monospace;font-size:13px;letter-spacing:0.05em;text-transform:uppercase;
    border-radius:12px;
    padding:13px 18px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer;flex:1;
    transition:background .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  button:hover:not(:disabled){background:var(--red);border-color:var(--red);box-shadow:0 3px 10px rgba(174,59,46,0.25);}
  button:active:not(:disabled){transform:scale(0.97);}
  button:disabled{opacity:0.4;cursor:not-allowed;}
  button.secondary{background:transparent;color:var(--ink-soft);border-color:var(--grid);flex:0 0 auto;box-shadow:none;}
  button.secondary:hover{background:var(--paper-2);color:var(--ink);box-shadow:none;}
  button.mic-btn{background:var(--paper-2);color:var(--ink);border-color:var(--grid);flex:0 0 auto;}
  button.mic-btn.recording{background:var(--error);color:var(--paper);border-color:var(--error);}

  .suggest-panel{
    background:#F6F1E4; border:1px dashed var(--gold); border-radius:12px; padding:14px 16px; margin-bottom:16px;
    font-size:13px; color:var(--ink-soft);
  }
  .suggest-panel .label{font-family:'Courier New', monospace;font-size:11px;color:var(--gold);letter-spacing:0.05em;text-transform:uppercase;margin-bottom:6px;}
  .suggest-word{display:inline-block;background:var(--paper);border:1px solid var(--grid);border-radius:8px;padding:3px 10px;margin:2px 4px 2px 0;font-family:'Courier New', monospace;font-size:12.5px;color:var(--ink);}

  .loading{text-align:center;padding:30px 0;color:var(--ink-soft);font-family:'Courier New', monospace;font-size:13px;}
  .dot{animation:blink 1.4s infinite;}
  .dot:nth-child(2){animation-delay:.2s;}
  .dot:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:0.2;}40%{opacity:1;}}

  .err-box{background:#F6E3DE;border:1px solid var(--error);border-radius:12px;color:var(--error);padding:12px 14px;font-size:13px;margin-bottom:14px;font-family:'Courier New', monospace;}

  .setup-card{background:var(--paper-2);border:1px solid var(--grid);border-radius:14px;border-left:4px solid var(--gold);padding:22px 20px;margin-bottom:16px;}
  .setup-card p{font-size:14px;line-height:1.6;margin:0 0 12px;}
  .setup-card a{color:var(--red);}
  .setup-card label{display:block;font-family:'Courier New', monospace;font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}

  /* ===== MENU LATERALE ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(42,38,34,0.45);
    opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:40;
  }
  .overlay.show{opacity:1; pointer-events:auto;}

  .side-menu{
    position:fixed; top:0; left:0; bottom:0; width:280px; max-width:82vw;
    background:var(--paper); border-right:1px solid var(--grid);
    transform:translateX(-100%); transition:transform .3s cubic-bezier(.34,1.06,.64,1);
    z-index:50; padding:20px 18px; overflow-y:auto;
  }
  .side-menu.show{transform:translateX(0);}

  .menu-section{
    background:var(--paper-2); border:1px solid var(--grid); border-radius:14px;
    padding:14px 14px 16px; margin:14px 0;
  }
  .menu-section:first-of-type{margin-top:36px;}
  .side-menu h3{
    font-family:'Ronin', 'Courier New', monospace; font-size:14px; letter-spacing:0.04em;
    color:var(--ink-soft); margin:0 0 10px; font-weight:normal;
  }
  .menu-close{
    background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer;
    float:right; padding:0; width:auto; flex:none;
  }
  .menu-row{display:flex; gap:8px; margin-bottom:2px;}
  .menu-row button{border-radius:10px; padding:10px 12px; font-size:12px;}
  .menu-row button.active-choice{background:var(--red); color:var(--paper); border-color:var(--red);}
  .menu-row button.secondary.active-choice{background:var(--red); color:var(--paper);}

  .menu-search{
    width:100%;margin-bottom:12px;padding:9px 12px;border-radius:10px;
    border:1px solid var(--grid);background:var(--paper);
    font-family:'Courier New', monospace;font-size:13px;color:var(--ink);
  }
  .search-results{
    background:var(--paper); border:1px dashed var(--gold); border-radius:10px;
    padding:10px 12px; margin-bottom:14px;
  }
  .search-results .label{color:var(--gold); margin-bottom:6px;}
  .search-results .vocab-tags{max-height:none;}

  .vocab-cols-menu .vocab-col{margin-bottom:14px;}
  .vocab-cols-menu .vocab-col:last-child{margin-bottom:0;}
  .vocab-col .label{font-size:11px;font-family:'Courier New', monospace;color:var(--red);margin-bottom:6px;letter-spacing:0.05em;}
  .label.collapsible{cursor:pointer; user-select:none; display:flex; align-items:center; gap:4px;}
  .collapse-arrow{display:inline-block; transition:transform .2s ease; font-size:10px;}
  .collapse-arrow.collapsed{transform:rotate(-90deg);}
  .vocab-tags.collapsed{display:none;}
  .vocab-tags{display:flex;flex-wrap:wrap;gap:6px;}
  .vocab-tags.scrollable{
    max-height:150px; overflow-y:auto; padding-right:4px;
    align-content:flex-start;
  }
  .vocab-tags.scrollable::-webkit-scrollbar{width:5px;}
  .vocab-tags.scrollable::-webkit-scrollbar-thumb{background:var(--grid);border-radius:3px;}
  .vocab-count{font-size:10px;color:var(--ink-soft);font-family:'Courier New', monospace;margin-left:4px;opacity:0.7;}
  .tag{background:var(--paper);border:1px solid var(--grid);border-radius:8px;padding:3px 9px;font-size:12px;font-family:'Courier New', monospace;color:var(--ink-soft);}
  .tag.active{color:var(--moss);border-color:var(--moss);}

  .menu-footer-btn{width:100%; margin-top:8px;}

  .calendar-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:6px;}
  .calendar-day{aspect-ratio:1;border-radius:4px;background:var(--grid);}
  .calendar-day.active{background:var(--red);}
  .calendar-caption{font-size:10px;color:var(--ink-soft);font-family:'Courier New', monospace;margin-top:6px;text-align:center;}

  .progress-path{display:flex;align-items:center;overflow-x:auto;padding:6px 2px;gap:0;}
  .path-node-wrap{display:flex;align-items:center;flex:none;}
  .path-node{
    width:30px;height:30px;border-radius:50%;flex:none;
    display:flex;align-items:center;justify-content:center;
    font-family:'Courier New', monospace;font-size:11px;font-weight:bold;
    background:var(--grid);color:var(--ink-soft);border:2px solid var(--grid);
    transition:background .3s ease, border-color .3s ease, transform .2s ease;
  }
  .path-node.done{background:var(--red);border-color:var(--red);color:var(--paper);}
  .path-node.current{background:var(--paper);border-color:var(--gold);color:var(--gold);transform:scale(1.15);}
  .path-connector{width:16px;height:2px;background:var(--grid);flex:none;}
  .path-connector.done{background:var(--red);}

  .history-list{max-height:220px; overflow-y:auto;}
  .history-item{
    display:flex; gap:8px; align-items:flex-start; padding:8px 0;
    border-bottom:1px solid var(--grid); font-size:12px;
  }
  .history-item:last-child{border-bottom:none;}
  .history-icon{flex:none; font-size:14px; margin-top:1px;}
  .history-body{flex:1; min-width:0;}
  .history-task{color:var(--ink-soft); font-size:11px; margin-bottom:2px;}
  .history-answer{color:var(--ink); font-family:'Courier New', monospace; word-break:break-word;}
  .history-empty{color:var(--ink-soft); font-size:12px; text-align:center; padding:10px 0;}
  .weekly-goal-wrap{margin-top:12px;}
  .level-bar-fill.weekly{background:linear-gradient(90deg, var(--teal), var(--moss));}

  .mode-switch{display:flex;justify-content:center;gap:8px;margin-top:14px;}
  .mode-btn{
    flex:none; background:var(--paper-2); border:1px solid var(--grid); color:var(--ink-soft);
    border-radius:20px; padding:7px 16px; font-size:11px;
  }
  .mode-btn.active-choice{background:var(--indigo); border-color:var(--indigo); color:var(--paper);}

  .chat-wrap{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .chat-bubble{
    max-width:85%; padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.5;
    animation:cardIn .3s ease;
  }
  .chat-bubble.user{align-self:flex-end; background:var(--indigo); color:var(--paper); border-bottom-right-radius:4px;}
  .chat-bubble.ai{align-self:flex-start; background:var(--paper-2); border:1px solid var(--grid); border-bottom-left-radius:4px;}
  .chat-bubble .chat-jp{font-size:15px; margin-bottom:2px;}
  .chat-bubble .chat-romaji{font-family:'Courier New', monospace; font-size:12px; opacity:0.85;}
  .chat-bubble .chat-note{margin-top:6px; font-size:12px; font-style:italic; opacity:0.85; border-top:1px dashed currentColor; padding-top:6px;}
  .chat-bubble .chat-speak{margin-top:6px;}
  .chat-empty{text-align:center; color:var(--ink-soft); font-size:13px; padding:30px 10px;}

  .review-btn-wrap{margin-bottom:16px;}
  .review-btn{background:var(--indigo);border-color:var(--indigo);}
  .review-btn:hover{background:var(--maroon);border-color:var(--maroon);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:20px;
    font-family:'Courier New', monospace; font-size:12px; z-index:60;
    opacity:0; pointer-events:none; transition:opacity .3s ease, transform .3s ease;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .reminder-note{font-size:11px;color:var(--ink-soft);line-height:1.5;margin-top:6px;}

  footer{display:none;}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<nav class="side-menu" id="sideMenu">
  <button class="menu-close" id="menuClose">✕</button>

  <div class="menu-section">
    <h3 id="menuLangTitle">🌐 Lingua / Language</h3>
    <div class="menu-row">
      <button class="secondary" id="menuLangIt">Italiano</button>
      <button class="secondary" id="menuLangEn">English</button>
    </div>
  </div>

  <div class="menu-section">
    <h3 id="menuSoundTitle">🔊 Suoni</h3>
    <div class="menu-row">
      <button class="secondary" id="menuSoundOn">🔊 ON</button>
      <button class="secondary" id="menuSoundOff">🔇 OFF</button>
    </div>
  </div>

  <div class="menu-section">
    <h3 id="menuThemeTitle">🎨 Tema</h3>
    <div class="menu-row">
      <button class="secondary" id="themeLightBtn">☀️ chiaro</button>
      <button class="secondary" id="themeDarkBtn">🌙 scuro</button>
    </div>
  </div>

  <div class="menu-section">

    <h3 id="menuVocabTitle">📚 Vocabolario</h3>
    <input type="text" id="vocabSearch" class="menu-search">
    <div class="search-results" id="searchResults" style="display:none;">
      <div class="label" id="searchResultsLabel"></div>
      <div class="vocab-tags" id="searchResultsTags"></div>
    </div>
    <div class="vocab-cols-menu">
      <div class="vocab-col">
        <div class="label collapsible" id="labelActive" data-target="activeTags">
          <span class="collapse-arrow" id="arrowActive">▾</span> attivo<span class="vocab-count" id="activeCount"></span>
        </div>
        <div class="vocab-tags scrollable" id="activeTags"></div>
      </div>
      <div class="vocab-col">
        <div class="label collapsible" id="labelLearning" data-target="learningTags">
          <span class="collapse-arrow" id="arrowLearning">▾</span> in apprendimento
        </div>
        <div class="vocab-tags" id="learningTags"></div>
      </div>
    </div>
  </div>

  <div class="menu-section">
    <h3 id="menuHistoryTitle">📜 Cronologia</h3>
    <div class="history-list" id="historyList"></div>
  </div>

  <div class="menu-section">
    <h3 id="menuReminderTitle">🔔 Promemoria</h3>
    <div class="menu-row">
      <button class="secondary" id="reminderOnBtn"></button>
      <button class="secondary" id="reminderOffBtn"></button>
    </div>
    <div class="reminder-note" id="reminderNote"></div>
  </div>

  <div class="menu-section">
    <h3 id="menuAccountTitle">⚙️ Account</h3>
    <button class="secondary menu-footer-btn" id="shareBtn"></button>
    <button class="secondary menu-footer-btn" id="exportBtn"></button>
    <button class="secondary menu-footer-btn" id="importBtn"></button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
    <button class="secondary menu-footer-btn" id="resetBtn"></button>
    <button class="secondary menu-footer-btn" id="changeKeyBtn"></button>
  </div>
</nav>

<div class="wrap">
  <header>
    <button class="menu-btn" id="menuOpen">☰</button>
    <div class="kanji-mark">日本語 道場</div>
    <h1>Nihongo <span class="accent">Dōjō</span></h1>
    <div class="subtitle" id="subtitleText">produzione attiva &middot; niente teoria &middot; solo output</div>
    <div class="level-bar-wrap">
      <div class="level-bar-track"><div class="level-bar-fill" id="levelBarFill" style="width:0%"></div></div>
      <div class="level-bar-label" id="levelBarLabel"></div>
    </div>
    <div class="mode-switch" id="modeSwitch">
      <button class="mode-btn" id="modeExerciseBtn"></button>
      <button class="mode-btn" id="modeChatBtn"></button>
    </div>
  </header>

  <div id="stamp" class="stamp"><b id="stampNum">0</b>streak</div>
  <div class="stats-row" id="statsRow"></div>
  <div class="streak-dots" id="streakDots"></div>

  <div class="card" id="pathCard" style="padding:14px 16px;">
    <div class="eyebrow" id="pathTitle">Percorso</div>
    <div class="progress-path" id="progressPath"></div>
  </div>

function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
// Deve essere chiamata SINCRONAMENTE dentro un gestore di click/tap,
// altrimenti i browser mobile bloccano l'audio creato dopo un'attesa asincrona (fetch).
function ensureAudioUnlocked(){
  try{
    const ctx = getAudioCtx();
    if(ctx.state === 'suspended') ctx.resume();
  }catch(e){}
}
function playTone(freqs, duration, type, volume, stagger){
  if(!soundEnabled) return;
  try{
    const ctx = getAudioCtx();
    const vol = volume || 0.12;
    const gap = stagger === undefined ? 0.08 : stagger;
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + i * gap + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * gap + duration);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i * gap);
      osc.stop(ctx.currentTime + duration + i * gap + 0.05);
    });
  }catch(e){}
}

function speakJapanese(text){
  if(!text || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'ja-JP';
    utter.rate = 0.85;
    const voices = window.speechSynthesis.getVoices();
    const jpVoice = voices.find(v => v.lang && v.lang.startsWith('ja'));
    if(jpVoice) utter.voice = jpVoice;
    window.speechSynthesis.speak(utter);
  }catch(e){}
}

function getRecognition(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if(!recognition){
    recognition = new SR();
    recognition.lang = 'ja-JP';
    recognition.interimResults = false;

  }
  return recognition;
}

// Usa il microfono come metodo alternativo per rispondere all'esercizio:
// riconosce il parlato in giapponese e lo inserisce nella casella di risposta,
// pronta per essere corretta esattamente come un testo digitato.
function startVoiceInputInto(targetId){
  const rec = getRecognition();
  if(!rec){
    pronResult = { unsupported: true };
    render();
    return;
  }
  if(isRecording) return;
  isRecording = true;
  pronResult = null;
  render();

  rec.onresult = (event) => {
    const heard = event.results[0][0].transcript;
    isRecording = false;
    pronResult = null;
    render();
    const ta = document.getElementById(targetId);
    if(ta){
      ta.value = heard;
      ta.focus();
    }
  };
  rec.onerror = () => {
    pronResult = { noResult: true };
    isRecording = false;
    render();
  };
  rec.onend = () => {
    isRecording = false;
    render();
  };
  try{ rec.start(); }catch(e){ isRecording = false; pronResult = { unsupported: true }; render(); }
}
function startVoiceAnswerInput(){ startVoiceInputInto('answerInput'); }
function startVoiceChatInput(){ startVoiceInputInto('chatInput'); }

async function callGeminiRaw(userMsg, systemPrompt){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 25000);
  try{
    const res = await fetch(url, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-goog-api-key': apiKey },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: systemPrompt }] },
        contents: [{ role:'user', parts:[{ text: userMsg }] }],
        generationConfig: { responseMimeType: 'application/json' }
      }),
      signal: controller.signal
    });
    if(!res.ok){
      const errText = await res.text();
      if(res.status === 429) throw new Error(t('errQuota'));
      if(res.status === 401) throw new Error(t('errApiKey'));
      throw new Error('Errore API Gemini: ' + res.status + ' ' + errText.slice(0,200));
    }
    const data = await res.json();
    if(!data.candidates || !data.candidates.length) throw new Error(t('errEmpty'));
    const text = data.candidates[0].content.parts.map(p => p.text || '').join('');
    return extractJson(text);
  } catch(e){
    if(e.name === 'AbortError') throw new Error(t('errTimeout'));
    throw e;
  } finally {
    clearTimeout(timeoutId);
  }
}
async function callGemini(userMsg){
  return callGeminiRaw(userMsg, CURRICULUM_SYSTEM_FOR());
}

function extractJson(text){
  const start = text.indexOf('{');
  if(start === -1) throw new Error('Nessun JSON trovato nella risposta.');
  let depth = 0, inString = false, escape = false;
  for(let i = start; i < text.length; i++){
    const ch = text[i];
    if(inString){
      if(escape) escape = false;
      else if(ch === '\\') escape = true;
      else if(ch === '"') inString = false;
    } else {
      if(ch === '"') inString = true;
      else if(ch === '{') depth++;
      else if(ch === '}'){
        depth--;
        if(depth === 0) return JSON.parse(text.slice(start, i + 1));
      }
    }
  }
  throw new Error('JSON incompleto nella risposta di Gemini.');
}

function defaultState(){
  return {
    levelLabel: 'A1 - base',
    activeVocab: ['watashi/boku = io / I', 'gohan = riso/pasto / rice, meal', 'hon = libro / book', 'anime = anime / anime', 'tabemasu = mangio / I eat', 'yomimasu = leggo / I read', 'mimasu = guardo / I watch'],
    learningVocab: [],
    grammarUnlocked: ['schema base wa/o/-masu'],
    streak: 0, bestStreak: 0, totalCorrect: 0, totalAttempts: 0,
    recentResults: [], exercisesToday: 0, lastActiveDate: null, activityDates: [],
    dailyCounts: {}, weeklyGoal: 20,
    history: [], chatMessages: [],
    currentExercise: null, pendingFeedback: null, pendingCorrect: null, pendingJpAnswer: null
  };
}

function loadState(){
  const raw = localStorage.getItem(STATE_KEY);
  if(raw){
    state = JSON.parse(raw);
    if(state.bestStreak === undefined) state.bestStreak = state.streak || 0;
    if(!state.recentResults) state.recentResults = [];
    if(state.exercisesToday === undefined){ state.exercisesToday = 0; state.lastActiveDate = null; }
    if(state.pendingJpAnswer === undefined) state.pendingJpAnswer = null;
    if(!state.activityDates) state.activityDates = [];
    if(!state.dailyCounts) state.dailyCounts = {};
    if(state.weeklyGoal === undefined) state.weeklyGoal = 20;
    if(!state.history) state.history = [];
    if(!state.chatMessages) state.chatMessages = [];
    return true;
  }
  return false;
}
function saveState(){ localStorage.setItem(STATE_KEY, JSON.stringify(state)); }

function bumpDailyCounter(){
  const today = new Date().toDateString();
  if(state.lastActiveDate !== today){ state.lastActiveDate = today; state.exercisesToday = 0; }
  state.exercisesToday++;
  if(!state.activityDates.includes(today)) state.activityDates.push(today);
  if(state.activityDates.length > 60) state.activityDates = state.activityDates.slice(-60);
  state.dailyCounts[today] = (state.dailyCounts[today] || 0) + 1;
}
function levelProgressPercent(){
  const n = state.grammarUnlocked ? state.grammarUnlocked.length : 1;
  return Math.min(100, Math.round((n / 10) * 100));
}

// Somma gli esercizi fatti negli ultimi 7 giorni (incluso oggi) per l'obiettivo settimanale
function weeklyCount(){
  let total = 0;
  for(let i = 0; i < 7; i++){
    const d = new Date();
    d.setDate(d.getDate() - i);
    total += (state.dailyCounts[d.toDateString()] || 0);
  }
  return total;
}

function pushHistory(entry){
  state.history.unshift(entry);
  if(state.history.length > 15) state.history = state.history.slice(0, 15);
}

// Genera gli ultimi 30 giorni (dal piu vecchio al piu recente) per il calendario di costanza
function last30Days(){
  const days = [];
  for(let i = 29; i >= 0; i--){
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toDateString());
  }
  return days;
}
function renderCalendar(){
  const grid = document.getElementById('calendarGrid');
  const caption = document.getElementById('calendarCaption');
  if(!grid || !state) return;
  const days = last30Days();
  const activeSet = new Set(state.activityDates || []);
  grid.innerHTML = days.map(d => `<div class="calendar-day ${activeSet.has(d) ? 'active' : ''}"></div>`).join('');
  const activeCount = days.filter(d => activeSet.has(d)).length;
  caption.textContent = `${activeCount}/30 ${t('giorniAttivi')}`;
}

function renderProgressPath(){
  const path = document.getElementById('progressPath');
  if(!path || !state) return;
  const unlocked = state.grammarUnlocked ? state.grammarUnlocked.length : 1;
  let html = '';
  for(let i = 1; i <= 10; i++){
    const isDone = i < unlocked || (i === unlocked && i === 10);
    const isCurrent = i === unlocked && i < 10;
    const label = state.grammarUnlocked && state.grammarUnlocked[i-1] ? state.grammarUnlocked[i-1] : '';
    const cls = isDone ? 'done' : (isCurrent ? 'current' : '');
    html += `<div class="path-node-wrap">
      <div class="path-node ${cls}" title="${escapeHtml(label)}">${i}</div>
      ${i < 10 ? `<div class="path-connector ${i < unlocked ? 'done' : ''}"></div>` : ''}
    </div>`;
  }
  path.innerHTML = html;
}

function renderWeeklyGoal(){
  const fill = document.getElementById('weeklyGoalFill');
  const caption = document.getElementById('weeklyGoalCaption');
  if(!fill || !caption || !state) return;
  const count = weeklyCount();
  const goal = state.weeklyGoal || 20;
  const pct = Math.min(100, Math.round((count / goal) * 100));
  fill.style.width = pct + '%';
  caption.textContent = `${count}/${goal} ${t('obiettivoSettimanale')}`;
}

function savePendingAnswer(answer){

}

    const raw = localStorage.getItem(PENDING_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function clearPendingAnswer(){
  try{ localStorage.removeItem(PENDING_KEY); }catch(e){}
}
async function retryPendingAnswerIfAny(){

    await fetchNext(pending.answer);

}

async function fetchNext(userAnswer, forceReviewMode){
  lastAnswerSent = userAnswer;
  pronResult = null;
  uiState.loading = true; uiState.error = null; render();

  const profileSummary = {
    level_label: state.levelLabel, active_vocab: state.activeVocab, learning_vocab: state.learningVocab,
    grammar_unlocked: state.grammarUnlocked, streak: state.streak, total_correct: state.totalCorrect, total_attempts: state.totalAttempts
  };

  let userMsg;
  if(forceReviewMode){
    userMsg = `Profilo studente attuale: ${JSON.stringify(profileSummary)}.
Lo studente ha chiesto esplicitamente una sessione di RIPASSO MIRATO: crea un esercizio che usi il più possibile parole dalla lista "learning_vocab" (quelle ancora in apprendimento), per rinforzarle. Non introdurre vocaboli nuovi in questo turno. feedback e correct devono essere null (è un nuovo esercizio, non una correzione).`;
  } else {
    userMsg = userAnswer === null
      ? `Primo avvio. Profilo studente: ${JSON.stringify(profileSummary)}. Dammi il primo esercizio (feedback e correct devono essere null).`
      : `Profilo studente attuale: ${JSON.stringify(profileSummary)}.
Esercizio dato: "${state.currentExercise.it}" (hint: "${state.currentExercise.hint}")
Risposta dello studente in romaji: "${userAnswer}"
Valuta la risposta e dammi il prossimo esercizio secondo le regole del sistema.`;
  }

  try{
    const result = await callGemini(userMsg);

    if(userAnswer !== null){
      state.totalAttempts++;
      bumpDailyCounter();
      state.recentResults.push(!!result.correct);
      if(state.recentResults.length > 10) state.recentResults.shift();

      if(result.correct){
        state.totalCorrect++; state.streak++;
        if(state.streak > state.bestStreak) state.bestStreak = state.streak;
        uiState.showStamp = true;
        playCorrectSound();
      } else {
        state.streak = 0;
        playWrongSound();
      }
      state.pendingFeedback = result.feedback; state.pendingCorrect = result.correct;
      state.pendingJpAnswer = result.correct_answer_jp || null;
      pushHistory({
        task: state.currentExercise ? state.currentExercise.it : '',
        answer: userAnswer,
        correct: !!result.correct,
        feedback: result.feedback,
        jp: result.correct_answer_jp || null,
        date: new Date().toISOString()
      });
    } else {
      state.pendingFeedback = null; state.pendingCorrect = null; state.pendingJpAnswer = null;
    }

    if(result.vocab_new && result.vocab_new.length){
      result.vocab_new.forEach(v => {
        if(!state.learningVocab.includes(v) && !state.activeVocab.includes(v)) state.learningVocab.push(v);
      });
    }
    if(result.vocab_learned && result.vocab_learned.length){
      result.vocab_learned.forEach(v => {
        state.learningVocab = state.learningVocab.filter(x => x !== v);
        if(!state.activeVocab.includes(v)) state.activeVocab.push(v);
      });
    }
    if(result.grammar_unlocked && !state.grammarUnlocked.includes(result.grammar_unlocked)){
      state.grammarUnlocked.push(result.grammar_unlocked);
    }
    if(result.level_label) state.levelLabel = result.level_label;

    state.currentExercise = { it: result.next_exercise_it, hint: result.next_exercise_hint };
    saveState();
    clearPendingAnswer();
  }catch(e){
    const isOffline = !navigator.onLine || e.message === 'Failed to fetch' || e.name === 'TypeError';
    if(isOffline && userAnswer !== null && !forceReviewMode){
      savePendingAnswer(userAnswer);
      uiState.error = t('errOffline');
    } else {
      uiState.error = e.message;
    }
    console.error(e);
  }
  uiState.loading = false; render();
}

async function handleSubmit(){
  ensureAudioUnlocked();
  const ta = document.getElementById('answerInput');
  const val = ta.value.trim();
  if(!val) return;
  playTapSound();
  uiState.showStamp = false;
  await fetchNext(val);
}

async function sendChatMessage(){
  ensureAudioUnlocked();
  const ta = document.getElementById('chatInput');
  if(!ta) return;
  const val = ta.value.trim();
  if(!val || chatLoading) return;
  playTapSound();
  ta.value = '';

  state.chatMessages.push({ role: 'user', text: val });
  saveState();
  chatLoading = true;
  render();

  const profileSummary = {
    level_label: state.levelLabel, active_vocab: state.activeVocab, learning_vocab: state.learningVocab
  };
  const recentTurns = state.chatMessages.slice(-6).map(m =>
    m.role === 'user' ? `Studente: ${m.text}` : `Tu: ${m.text_jp || m.text}`
  ).join('\n');
  const userMsg = `Profilo studente: ${JSON.stringify(profileSummary)}.
Conversazione recente:
${recentTurns}

Rispondi al messaggio più recente dello studente, continuando la conversazione naturalmente.`;

  try{
    const result = await callGeminiChat(userMsg);
    state.chatMessages.push({
      role: 'ai',
      text: result.reply_romaji || '',
      text_jp: result.reply_jp || '',
      note: result.note || null
    });
    saveState();
  }catch(e){
    uiState.error = e.message;
    console.error(e);
  }
  chatLoading = false;
  render();
}

}

async function handleShare(){
  const text = t('shareTextTemplate')
    .replace('{level}', state.levelLabel)
    .replace('{streak}', state.bestStreak || 0)
    .replace('{vocab}', state.activeVocab.length)
    .replace('{accuracy}', state.totalAttempts ? Math.round(100*state.totalCorrect/state.totalAttempts) : 0);
  if(navigator.share){
    try{ await navigator.share({ title: 'Nihongo Dōjō', text }); }
    catch(e){ /* condivisione annullata dall'utente, ignora */ }
  } else if(navigator.clipboard){
    try{
      await navigator.clipboard.writeText(text);
      showToast(t('shareCopied'));
    }catch(e){ showToast(text); }
  } else {
    showToast(text);
  }
}

  const a = document.createElement('a');
  a.href = url;
  a.download = 'nihongo-dojo-progresso.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(t('exportSuccess'));

function handleImportFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try{
      const imported = JSON.parse(ev.target.result);
      if(!imported || typeof imported !== 'object' || !('activeVocab' in imported)){
        throw new Error('formato non valido');
      }
      state = imported;
      if(!state.activityDates) state.activityDates = [];
      if(!state.recentResults) state.recentResults = [];
      saveState();
      closeMenu();
      render();
      showToast(t('importSuccess'));
    }catch(err){
      showToast(t('importError'));
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

const REMINDER_KEY = 'nihongo-reminder-enabled';
function isReminderEnabled(){ return localStorage.getItem(REMINDER_KEY) === '1'; }
async function enableReminder(){
  if(!('Notification' in window)){
    showToast(t('reminderPermissionDenied'));
    return;
  }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){
    showToast(t('reminderPermissionDenied'));
    return;
  }
  localStorage.setItem(REMINDER_KEY, '1');
  renderMenuChoices();
  checkReminderNow();
}
function disableReminder(){
  localStorage.setItem(REMINDER_KEY, '0');
  renderMenuChoices();
}
function checkReminderNow(){
  if(!isReminderEnabled() || !('Notification' in window) || Notification.permission !== 'granted') return;
  if(!state) return;
  const today = new Date().toDateString();
  const doneToday = state.lastActiveDate === today && state.exercisesToday > 0;
  if(!doneToday){
    try{
      new Notification(t('reminderMsgTitle'), { body: t('reminderMsgBody'), icon: 'icon-192.png' });
    }catch(e){}
  }
}

        ${m.note ? `<div class="chat-note">${escapeHtml(m.note)}</div>` : ''}

    }).join('');

  }
  html += `</div>`;

  html += `<div class="answer-zone"><textarea id="chatInput" placeholder="${t('chatPlaceholder')}"></textarea></div>
  <div class="actions">
    <button id="chatSendBtn" ${chatLoading ? 'disabled' : ''}>${t('invia')}</button>
    <button class="mic-btn ${isRecording ? 'recording' : ''}" id="chatMicBtn" title="${t('micLabel')}">${isRecording ? '🎤...' : '🎤'}</button>
  </div>`;

  app.innerHTML = html;

  document.querySelectorAll('[data-chat-speak]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.getAttribute('data-chat-speak'), 10);
      const msg = state.chatMessages[idx];
      if(msg && msg.text_jp) speakJapanese(msg.text_jp);
    });
  });

  const sendBtn = document.getElementById('chatSendBtn');
  if(sendBtn) sendBtn.addEventListener('click', sendChatMessage);

  const chatMicBtn = document.getElementById('chatMicBtn');
  if(chatMicBtn) chatMicBtn.addEventListener('click', startVoiceChatInput);

  const chatInput = document.getElementById('chatInput');
  if(chatInput){
    chatInput.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendChatMessage(); }
    });
    if(!chatLoading) chatInput.focus();
  }

  const wrap = document.getElementById('chatWrap');
  if(wrap) wrap.scrollTop = wrap.scrollHeight;
}

function renderHistory(){
  const list = document.getElementById('historyList');
  if(!list || !state) return;
  if(!state.history || !state.history.length){
    list.innerHTML = `<div class="history-empty">${t('cronologiaVuota')}</div>`;
    return;
  }
  list.innerHTML = state.history.map(h => `
    <div class="history-item">
      <span class="history-icon">${h.correct ? '✅' : '❌'}</span>
      <div class="history-body">
        <div class="history-task">${escapeHtml(h.task || '')}</div>
        <div class="history-answer">${escapeHtml(h.answer || '')}</div>
      </div>
    </div>
  `).join('');
}

function renderVocabTags(){
  const activeTags = document.getElementById('activeTags');
  const learningTags = document.getElementById('learningTags');
  const activeCount = document.getElementById('activeCount');
  const searchResults = document.getElementById('searchResults');
  const searchResultsTags = document.getElementById('searchResultsTags');
  const searchResultsLabel = document.getElementById('searchResultsLabel');
  if(!state || !activeTags || !learningTags) return;

  // Le due sezioni mostrano SEMPRE la lista completa, non filtrata:
  // il loro stato aperto/chiuso dipende solo dal click dell'utente, mai dalla ricerca.
  activeTags.innerHTML = state.activeVocab.map(v => `<span class="tag active">${escapeHtml(v)}</span>`).join('') || '<span class="tag">—</span>';
  learningTags.innerHTML = state.learningVocab.length
    ? state.learningVocab.map(v => `<span class="tag">${escapeHtml(v)}</span>`).join('')
    : '<span class="tag">—</span>';
  if(activeCount) activeCount.textContent = ` (${state.activeVocab.length})`;
  applyVocabCollapseVisual();

  // La ricerca vive per conto suo, in un riquadro separato, senza toccare le sezioni sopra.
  if(searchResults && searchResultsTags && searchResultsLabel){
    const term = vocabSearchTerm.trim();
    if(!term){
      searchResults.style.display = 'none';
    } else {
      searchResults.style.display = 'block';
      const activeMatches = filterVocab(state.activeVocab);
      const learningMatches = filterVocab(state.learningVocab);
      const allMatches = [
        ...activeMatches.map(v => ({ v, active: true })),
        ...learningMatches.map(v => ({ v, active: false }))
      ];
      searchResultsLabel.textContent = `🔍 ${allMatches.length} ${t('risultatiTrovati')}`;
      searchResultsTags.innerHTML = allMatches.length
        ? allMatches.map(({v, active}) => `<span class="tag ${active ? 'active' : ''}">${escapeHtml(v)}</span>`).join('')
        : `<span class="tag">${t('nessunRisultato')}</span>`;
    }
  }
}

// Le sezioni "attivo"/"in apprendimento" restano aperte o chiuse solo in base
// alla preferenza manuale dell'utente — la ricerca non le tocca mai.
function applyVocabCollapseVisual(){
  ['activeTags', 'learningTags'].forEach(targetId => {
    const target = document.getElementById(targetId);
    const arrowId = targetId === 'activeTags' ? 'arrowActive' : 'arrowLearning';
    const arrow = document.getElementById(arrowId);
    if(!target) return;
    const shouldCollapse = vocabCollapsedState[targetId];
    target.classList.toggle('collapsed', shouldCollapse);
    if(arrow) arrow.classList.toggle('collapsed', shouldCollapse);
  });
}

// Cerca un termine sia nella parte giapponese/romaji sia nella traduzione,
// case-insensitive, in qualsiasi lingua sia stata salvata la voce.
function filterVocab(list){
  if(!vocabSearchTerm.trim()) return list;
  const q = vocabSearchTerm.trim().toLowerCase();
  return list.filter(entry => entry.toLowerCase().includes(q));
}

function renderPronResult(){
  if(!pronResult) return '';
  if(pronResult.unsupported){
    return `<div class="pron-result nomatch">${t('micNotSupported')}</div>`;
  }
  if(pronResult.noResult){
    return `<div class="pron-result nomatch">${t('micNoResult')}</div>`;
  }
  if(pronResult.matched){
    return `<div class="pron-result match">✓ ${t('pronMatch')} <em>"${escapeHtml(pronResult.heard)}"</em></div>`;
  }
  return `<div class="pron-result nomatch">${t('pronOff')} <em>"${escapeHtml(pronResult.heard)}"</em></div>`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('menuClose').addEventListener('click', closeMenu);
document.getElementById('overlay').addEventListener('click', closeMenu);

document.getElementById('menuLangEn').addEventListener('click', () => setLang('en'));
document.getElementById('menuSoundOn').addEventListener('click', () => setSound(true));
document.getElementById('menuSoundOff').addEventListener('click', () => setSound(false));
document.getElementById('resetBtn').addEventListener('click', handleReset);
document.getElementById('changeKeyBtn').addEventListener('click', handleChangeKey);
document.getElementById('reminderOnBtn').addEventListener('click', enableReminder);
document.getElementById('reminderOffBtn').addEventListener('click', disableReminder);
document.getElementById('themeLightBtn').addEventListener('click', () => setTheme('light'));
document.getElementById('themeDarkBtn').addEventListener('click', () => setTheme('dark'));
document.getElementById('modeExerciseBtn').addEventListener('click', () => setMode('exercise'));
document.getElementById('modeChatBtn').addEventListener('click', () => setMode('chat'));
document.getElementById('shareBtn').addEventListener('click', handleShare);
document.getElementById('exportBtn').addEventListener('click', handleExport);
document.getElementById('importBtn').addEventListener('click', handleImportClick);
document.getElementById('importFile').addEventListener('change', handleImportFile);
document.getElementById('vocabSearch').addEventListener('input', (e) => {
  vocabSearchTerm = e.target.value;
  renderVocabTags();
});
document.querySelectorAll('.label.collapsible').forEach(label => {
  label.addEventListener('click', () => {
    const targetId = label.getAttribute('data-target');
    vocabCollapsedState[targetId] = !vocabCollapsedState[targetId];
    applyVocabCollapseVisual();
  });
});

bootstrap();
</script>
